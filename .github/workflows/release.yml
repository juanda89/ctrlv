name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0). If empty, uses Info.plist."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve release version
        # The dispatch input goes through an env var: interpolating it into
        # the script text would let a workflow_dispatch caller inject shell.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print:CFBundleShortVersionString" Resources/Info.plist)
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must follow semantic format x.y.z. Got: ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Derive Sparkle build number from semantic version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          if [[ ! "${MAJOR}" =~ ^[0-9]+$ || ! "${MINOR}" =~ ^[0-9]+$ || ! "${PATCH}" =~ ^[0-9]+$ ]]; then
            echo "VERSION must follow semantic format x.y.z. Got: ${VERSION}"
            exit 1
          fi
          BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"
          echo "Resolved BUILD_NUMBER=${BUILD_NUMBER}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Validate signing secrets
        # A missing secret used to degrade silently to an ad-hoc, un-notarized
        # build that Sparkle would still install everywhere. Fail here instead.
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in SPARKLE_EDDSA_PRIVATE_KEY APPLE_DEVELOPER_ID_APPLICATION APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is required to publish a signed, notarized release."
              exit 1
            fi
          done

      - name: Build release artifacts
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CTRLV_REQUIRE_STABLE_SIGNING: "1"
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: ./scripts/build-release.sh "${VERSION}" "${BUILD_NUMBER}"

      - name: Validate packaged app integrity
        run: |
          ZIP_PATH="dist/${VERSION}/ctrlv-${VERSION}.zip"
          if [[ ! -s "${ZIP_PATH}" ]]; then
            echo "Missing Sparkle zip artifact: ${ZIP_PATH}"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          ditto -x -k "${ZIP_PATH}" "${TMP_DIR}"

          APP_PATH="${TMP_DIR}/ctrlv.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Sparkle zip does not contain ctrlv.app"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          # Gatekeeper's own verdict and the stapled notarization ticket: an
          # ad-hoc or un-notarized build fails here instead of shipping.
          spctl --assess --type exec --verbose=2 "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

          SPARKLE_BASE="${APP_PATH}/Contents/Frameworks/Sparkle.framework/Versions/B"
          REQUIRED_EXECUTABLES=(
            "${SPARKLE_BASE}/Autoupdate"
            "${SPARKLE_BASE}/Updater.app/Contents/MacOS/Updater"
            "${SPARKLE_BASE}/XPCServices/Downloader.xpc/Contents/MacOS/Downloader"
            "${SPARKLE_BASE}/XPCServices/Installer.xpc/Contents/MacOS/Installer"
          )

          for executable in "${REQUIRED_EXECUTABLES[@]}"; do
            if [[ ! -x "${executable}" ]]; then
              echo "Missing Sparkle executable: ${executable}"
              exit 1
            fi
          done

      - name: Ensure release notes file
        run: |
          NOTES_FILE="dist/${VERSION}/release-notes.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            cat > "${NOTES_FILE}" <<EOF
          # ctrl+v ${VERSION}

          - Improvements and fixes.
          EOF
          fi
          cp "${NOTES_FILE}" "dist/${VERSION}/ctrlv-${VERSION}.md"

      - name: Prepare stable latest DMG alias
        run: |
          cp "dist/${VERSION}/ctrlv-${VERSION}.dmg" "dist/${VERSION}/ctrlv-latest.dmg"

      - name: Validate latest DMG alias
        run: |
          LATEST_DMG="dist/${VERSION}/ctrlv-latest.dmg"
          if [[ ! -s "${LATEST_DMG}" ]]; then
            echo "Missing or empty ${LATEST_DMG}"
            exit 1
          fi

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: ${{ vars.CTRLV_DOWNLOADS_BASE_URL }}
          RELEASE_NOTES_URL_PREFIX: ${{ vars.CTRLV_RELEASE_NOTES_BASE_URL }}
        run: |
          DOWNLOAD_PREFIX="${DOWNLOAD_URL_PREFIX:-https://github.com/juanda89/ctrlv/releases/download/v${VERSION}}"
          NOTES_PREFIX="${RELEASE_NOTES_URL_PREFIX:-https://github.com/juanda89/ctrlv/releases/download/v${VERSION}}"
          ./scripts/generate-appcast.sh "${VERSION}" "${DOWNLOAD_PREFIX}" "${NOTES_PREFIX}"

      - name: Validate appcast is universal-compatible
        run: |
          APPCAST="updates/stable/appcast.xml"
          if [[ ! -s "${APPCAST}" ]]; then
            echo "Missing appcast.xml"
            exit 1
          fi
          if ! grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "${APPCAST}"; then
            echo "Appcast does not contain release version ${VERSION}"
            exit 1
          fi
          if grep -q "<sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>" "${APPCAST}"; then
            echo "Appcast is arm64-only; this would break Intel updates."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/${{ env.VERSION }}/ctrlv-${{ env.VERSION }}.dmg
            dist/${{ env.VERSION }}/ctrlv-latest.dmg
            dist/${{ env.VERSION }}/ctrlv-${{ env.VERSION }}.zip
            dist/${{ env.VERSION }}/ctrlv-${{ env.VERSION }}.md
            dist/${{ env.VERSION }}/SHA256SUMS.txt
            dist/${{ env.VERSION }}/release-notes.md
            updates/stable/appcast.xml

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  # Windows build published to the same GitHub Release as the Mac artifacts.
  # Unsigned for the private beta (code signing deferred until traction):
  # testers use "More info → Run anyway" on SmartScreen once.
  release-windows:
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "Windows release needs a tag or an explicit version"; exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must follow semantic format x.y.z. Got: ${VERSION}"; exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish (self-contained, single folder)
        shell: bash
        run: |
          dotnet publish windows/ControlV.App/ControlV.App.csproj -c Release -r win-x64 --self-contained true \
            -p:Version=${VERSION} -p:PublishSingleFile=false -o windows/publish

      - name: Package with Velopack
        shell: bash
        run: |
          vpk pack --packId ctrlv --packVersion "${VERSION}" --packDir windows/publish --mainExe ctrlv.exe \
            --packTitle "ctrl+v" --packAuthors "Control-V" --outputDir windows/releases
          ls -la windows/releases

      - name: Attach Windows assets to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            windows/releases/*
