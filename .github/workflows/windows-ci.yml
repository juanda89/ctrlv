name: Windows CI

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-ci.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore windows/ControlV.sln
      - name: Build
        run: dotnet build windows/ControlV.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test windows/ControlV.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      # Portable build for testing without cutting a release: download it from
      # the run's Artifacts (unsigned; unzip and run ctrlv.exe).
      - name: Publish portable build
        if: github.event_name == 'push'
        shell: bash
        run: |
          dotnet publish windows/ControlV.App/ControlV.App.csproj -c Release -r win-x64 --self-contained true -o windows/publish
          echo "commit=${GITHUB_SHA::7}" > windows/publish/BUILD.txt
      - name: Upload portable build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctrlv-windows-portable-${{ github.sha }}
          path: windows/publish
          retention-days: 14
