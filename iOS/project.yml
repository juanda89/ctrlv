# XcodeGen spec — regenerate with `xcodegen generate` (run from iOS/).
# The .xcodeproj is generated, not hand-edited; commit this file, not the project.
name: ControlV
options:
  bundleIdPrefix: info.controlv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Viko Holdings LLC (Apple Developer Program, organization).
    DEVELOPMENT_TEAM: "5ZFYF422LX"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ControlVCore:
    path: ..
targets:
  Control-V:
    type: application
    platform: iOS
    sources:
      - path: Sources/ControlViOS
      - path: Resources/App
      # Permission marks the extensions write and the app reads.
      - path: Shared/SetupState.swift
    dependencies:
      - package: ControlVCore
        product: ControlVCore
      - target: Control-V Share
      - target: Control-V Keyboard
      - target: Control-V Translation
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Control-V
        # Default translation app (iOS 18.4+): the extension needs the network.
        com.apple.developer.translation-ui-provider.network-access: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPhone-only, portrait-only. Without this App Store Connect rejects the
        # upload (ITMS-90474: portrait-only apps must opt out of iPad multitasking).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CtrlVTranslationAPIURL: https://hdfhonbgkkiffhkwoivd.functions.supabase.co/translate
        CtrlVAuthAPIBaseURL: https://hdfhonbgkkiffhkwoivd.functions.supabase.co
        NSUserActivityTypes: [info.controlv.translate]
    entitlements:
      path: Generated/Control-V.entitlements
      properties:
        com.apple.security.application-groups: [group.info.controlv.shared]
        # Lets people pick Control-V in Settings → Apps → Default Apps → Translation.
        com.apple.developer.translation-app: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.controlv.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Control-V
  Control-V Share:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Resources/Share
      - path: Shared
      - path: Sources/ControlViOS/Design
    dependencies:
      - package: ControlVCore
        product: ControlVCore
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Control-V
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Generated/Control-V-Share.entitlements
      properties:
        com.apple.security.application-groups: [group.info.controlv.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.controlv.ios.share
        TARGETED_DEVICE_FAMILY: "1"
  Control-V Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
      - path: Resources/Keyboard
      - path: Shared
      - path: Sources/ControlViOS/Design
    dependencies:
      - package: ControlVCore
        product: ControlVCore
    info:
      path: Generated/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Control-V Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Generated/Control-V-Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.info.controlv.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.controlv.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1"
  # Default translation app (iOS 18.4+): ExtensionKit extension the system
  # hosts when people tap Translate on selected text in any app.
  Control-V Translation:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: TranslationExtension
      - path: Resources/Translation
      - path: Shared
      - path: Sources/ControlViOS/Design
    dependencies:
      - package: ControlVCore
        product: ControlVCore
    info:
      path: Generated/Translation-Info.plist
      properties:
        CFBundleDisplayName: Control-V
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.public.translation-ui-provider
        com.apple.developer.translation-ui-provider.network-access: true
    entitlements:
      path: Generated/Control-V-Translation.entitlements
      properties:
        com.apple.security.application-groups: [group.info.controlv.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.controlv.ios.translation
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  # Renders the keyboard panel, share sheet and translation sheet (which can't
  # be driven from the command line) to PNGs:
  #   TEST_RUNNER_SNAPSHOT_DIR=/abs/dir xcodebuild test … -only-testing:'Control-V Snapshots'
  Control-V Snapshots:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: Tests/Snapshots
      - path: Sources/ControlViOS/Design
      - path: Sources/ControlViOS/Views/PaywallView.swift
      - path: Sources/ControlViOS/Subscription
      - path: Sources/ControlViOS/App/DebugLaunch.swift
      - path: Shared
      - path: KeyboardExtension
      - path: ShareExtension
      - path: TranslationExtension
        excludes:
          - "TranslationProviderExtension.swift"
    dependencies:
      - target: Control-V
      - package: ControlVCore
        product: ControlVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.controlv.ios.snapshots
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Control-V:
    build:
      targets:
        Control-V: all
        Control-V Snapshots: [test]
    test:
      config: Debug
      targets:
        - Control-V Snapshots
    run:
      config: Debug
      # Local StoreKit config: the paywall shows the real product/price/trial in
      # the simulator without App Store Connect. Sandbox/production use ASC.
      storeKitConfiguration: Configuration.storekit
    archive:
      config: Release
